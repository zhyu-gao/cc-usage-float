name: build

# 只有推送 tag v* 才构建：创建 GitHub Release 并上传 exe
# 普通分支提交（含 main）不再触发任何构建
# 也可以在 Actions 页面手动触发（只出 artifact，不发布 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# softprops/action-gh-release 需要写 Release 的权限
permissions:
  contents: write

# 同一 tag 连续触发时，取消上一次未完成的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # package-lock 里的 resolved 指向 npmmirror（本地生成），显式声明避免 CI 走默认源拉不到
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_registry: https://registry.npmmirror.com

      # 防止 tag 与 package.json 版本漂移，产物文件名和 Release 标题才对得上
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg_version tag=$tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag v$tag_version does not match package.json $pkg_version"
            exit 1
          fi

      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
        env:
          # CI 上没有代码签名证书，跳过证书探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cc-usage-float-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
